name: Build Cross-Platform Server

on:
  push:
    branches: [ server ]
  pull_request:
    branches: [ server ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: win-x64
            os: windows-latest
            suffix: .exe
          - target: linux-x64
            os: ubuntu-latest
            suffix: ''
          - target: linux-arm64
            os: ubuntu-latest
            suffix: ''
          - target: osx-x64
            os: macos-latest
            suffix: ''
          - target: osx-arm64
            os: macos-latest
            suffix: ''

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Self-Contained Server
      run: |
        dotnet publish -c Release -r ${{ matrix.target }} -p:PublishSingleFile=true -p:PublishReadyToRun=true --self-contained -o publish/${{ matrix.target }}

    - name: Rename Executable
      shell: bash
      run: |
        mv publish/${{ matrix.target }}/android-device-manager-server${{ matrix.suffix }} publish/${{ matrix.target }}/dms-server-${{ matrix.target }}${{ matrix.suffix }}

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dms-server-${{ matrix.target }}
        path: publish/${{ matrix.target }}/dms-server-${{ matrix.target }}${{ matrix.suffix }}
